services:
  - type: web
    name: venom-md-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: PREFIX
        value: .
      - key: SESSION_NAMESPACE
        value: venom
      - key: SESSION_ID
        sync: false
      - key: MONGODB
        sync: false
      - key: MODS
        sync: false
      - key: PACKNAME
        value: VENOM MD BOT
      - key: AUTHOR
        value: "by: TAPRUSH EMP (Micheal)"
