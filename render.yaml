services:
  - type: web
    name: venom-md-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BOT_NAME
        value: VENOM MD BOT
      - key: OWNER_NAME
        value: TAPRUSH EMP (Micheal)
      - key: OWNER_NUMBER
        value: 2348021016309
      - key: PREFIX
        value: .
      - key: COMMAND_MODE
        value: public
      - key: TIMEZONE
        value: Africa/Lagos
      - key: SESSION_NAMESPACE
        value: venom
      - key: SESSION_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
